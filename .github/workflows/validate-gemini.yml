name: Validar Gemini real (manual)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo disponível para a chave Gemini da conta
        required: true
        default: gemini-2.5-flash
        type: string

permissions:
  contents: read

concurrency:
  group: gemini-real-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testar o verificador sem acesso ao Google
        run: python -m unittest discover -s tools -p 'test_validar_gemini_real.py' -v
      - name: Compilar e testar sem credencial real
        env:
          GEMINI_API_KEY: ""
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validar chamada real pelo backend isolado
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          GEMINI_TIMEOUT_SECONDS: "20"
          SPRING_PROFILES_ACTIVE: local
          PORT: "8091"
          ADMIN_PASSWORD_HASH: ""
          ANALYST_PASSWORD_HASH: ""
          COOKIE_SECURE: "false"
          STORAGE_PROVIDER: local
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "Configure o repository secret GEMINI_API_KEY antes de executar a validação real."
            exit 1
          fi
          work_dir="$RUNNER_TEMP/hydroguard-gemini"
          mkdir -p "$work_dir/uploads"
          export UPLOAD_DIR="$work_dir/uploads"
          app_jar="$GITHUB_WORKSPACE/target/hydroguard-citizen-1.0.0.jar"
          [[ -s "$app_jar" ]] || { echo "JAR compilado não encontrado."; exit 1; }
          cd "$work_dir"
          java -jar "$app_jar" > application.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          # A chave permanece somente no backend; o cliente HTTP usa apenas sessão/CSRF.
          env -u GEMINI_API_KEY python "$GITHUB_WORKSPACE/tools/validar-gemini-real.py" \
            --base-url http://127.0.0.1:8091 \
            --backend-log "$work_dir/application.log" \
            --output "$work_dir/result.json"
      - name: Resumir evidência sem dados sensíveis
        if: always()
        run: |
          result_file="$RUNNER_TEMP/hydroguard-gemini/result.json"
          if [[ -f "$result_file" ]]; then
            printf '%s\n' '### Validação Gemini real' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
            printf '\n%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar somente o resultado sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-real-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hydroguard-gemini/result.json
          if-no-files-found: warn
          retention-days: 7
