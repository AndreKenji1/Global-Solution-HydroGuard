name: CI - Build, testes e imagem

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydroguard_test
          POSTGRES_USER: hydroguard
          # Credencial efêmera exclusiva do serviço de testes deste job.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydroguard -d hydroguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, testar H2/mocks e integrar PostgreSQL
        env:
          JDBC_URL: jdbc:postgresql://localhost:5432/hydroguard_test
          DB_USERNAME: hydroguard
          DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: mvn --batch-mode --no-transfer-progress -Ppostgres-it clean verify
      - name: Testar o verificador de integração Gemini sem serviços externos
        run: python -m unittest discover -s tools -p 'test_validar_gemini_real.py' -v
      - name: Arquivar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
  image:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem da revisão validada
        env:
          IMAGE: hydroguard-citizen:${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
          docker save "$IMAGE" | gzip > hydroguard-image.tar.gz
      - name: Disponibilizar imagem para promoção manual
        uses: actions/upload-artifact@v4
        with:
          name: hydroguard-image-${{ github.sha }}
          path: hydroguard-image.tar.gz
          compression-level: 0
          retention-days: 14
